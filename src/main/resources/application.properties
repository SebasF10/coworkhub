spring.application.name=coworkhub

# Base de datos activa: h2 (por defecto), mysql o postgres.
# Cambiala con --spring.profiles.active=mysql o con la variable de entorno SPRING_PROFILES_ACTIVE.
# La conexión de cada una está en application-h2.properties, application-mysql.properties
# y application-postgres.properties.
spring.profiles.active=mysql

spring.jpa.open-in-view=true

# Reloj de la aplicación. Vacío = hora real. Ejemplo para pruebas:
# coworkhub.reloj.fijo=2030-06-03T08:00:00
coworkhub.reloj.fijo=2030-06-03T08:00:00
# Documentación de la API (Swagger UI en /doc/swagger-ui.html)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html
springdoc.packages-to-scan=com.coworkhub

# JWT
# Solo para fines educativos: en producción la clave debe venir de una variable de entorno
# o de un gestor de secretos, nunca del código ni del repositorio. Mínimo 32 caracteres.
coworkhub.seguridad.jwt.clave=esta-clave-es-solo-para-fines-educativos-del-proyecto-coworkhub-0987654321
coworkhub.seguridad.jwt.expiracion-minutos=60